<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMC Spark — Access Verification</title>

  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="robots" content="noindex,nofollow">

  <link rel="stylesheet" href="/assets/app.css">
  <style>
    :root{--ink:#0f172a;--muted:#64748b;--bg:#0b1020;--panel:#0f172a;--line:#1f2f49;--brand:#4f7cab;--brand2:#2f4d70;--danger:#e5675f;--ok:#4caf82}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:#e5e7eb;margin:0}
    .wrap{max-width:460px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(2,6,23,.35);text-align:center}
    h1{margin:8px 0 6px;font-size:20px}
    .sub{color:var(--muted);margin:0 0 16px;font-size:13.5px;line-height:1.5}
    .cam-box{position:relative;width:100%;aspect-ratio:4/3;background:#0b1226;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
    .cam-box video, .cam-box img{width:100%;height:100%;object-fit:cover;display:block}
    .cam-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;font-size:13px;color:var(--muted);text-align:center}
    .field{display:grid;gap:6px;margin:10px 0;text-align:left}
    .field input{width:100%;box-sizing:border-box;background:#0b1226;border:1px solid var(--line);border-radius:10px;padding:12px;color:#e5e7eb;font-size:14px}
    .row{display:flex;gap:10px}
    .row .btn{flex:1}
    .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--brand);color:#fff;font-weight:800;border:none;border-radius:10px;padding:11px 14px;cursor:pointer;font-size:14px}
    .btn:hover{background:var(--brand2)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn.ghost{background:transparent;border:1px solid var(--line);color:#e5e7eb}
    .status{min-height:20px;margin-top:10px;font-size:13px}
    .status.err{color:var(--danger)}
    .status.ok{color:var(--ok)}
    .logo{display:block;margin:0 auto 12px;max-width:140px}
    .top{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:4px}
    .top svg{width:26px;height:26px}
    .logout-link{display:block;margin-top:14px;color:var(--muted);font-size:12.5px;text-decoration:none}
    .logout-link:hover{color:#e5e7eb}
  </style>
</head>
<body data-page="admin-verify">
  <div class="wrap">
    <a href="https://amcspark.com" target="_blank">
      <img src="/assets/logo.png" alt="AMC Spark Logo" class="logo">
    </a>
    <div class="top">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#4f7cab"/><stop offset=".7" stop-color="#c99a45"/></linearGradient></defs>
        <path d="M13 2l-10 9h7l-3 11 10-12h-6l2-8z"/>
      </svg>
      <h1>Access Verification</h1>
    </div>
    <p class="sub">For our access records, please take a quick photo and confirm your name before continuing to the office-use area.</p>

    <div class="cam-box" id="camBox">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" style="display:none"></canvas>
    </div>

    <div class="row" id="camActions">
      <button class="btn" id="captureBtn" type="button">📸 Take Photo</button>
    </div>
    <div class="row" id="retakeActions" style="display:none">
      <button class="btn ghost" id="retakeBtn" type="button">Retake</button>
    </div>

    <div class="field">
      <label for="nameInput">Your name</label>
      <input id="nameInput" placeholder="e.g., Akshit" autocomplete="name" required>
    </div>

    <button class="btn" id="continueBtn" type="button" disabled style="width:100%;margin-top:6px">Continue</button>
    <div class="status" id="status"></div>

    <a href="/admin/logout" class="logout-link">Not you? Log out instead</a>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const camBox = document.getElementById('camBox');
    const captureBtn = document.getElementById('captureBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const camActions = document.getElementById('camActions');
    const retakeActions = document.getElementById('retakeActions');
    const nameInput = document.getElementById('nameInput');
    const continueBtn = document.getElementById('continueBtn');
    const statusEl = document.getElementById('status');

    let stream = null;
    let photoDataUrl = null;

    function setStatus(msg, cls) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (cls ? ' ' + cls : '');
    }

    function updateContinueState() {
      continueBtn.disabled = !(photoDataUrl && nameInput.value.trim());
    }
    nameInput.addEventListener('input', updateContinueState);

    function showCameraMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'cam-msg';
      msg.textContent = text;
      camBox.appendChild(msg);
    }

    async function startCamera() {
      captureBtn.disabled = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = stream;
        try { await video.play(); } catch (e) { console.warn('video.play() failed:', e); }
        // A resolved play() doesn't guarantee a decoded frame is ready yet -
        // wait for one so "Take Photo" never captures a blank frame.
        if (video.readyState < 2) {
          await new Promise((resolve) => {
            const done = () => { video.removeEventListener('loadeddata', done); resolve(); };
            video.addEventListener('loadeddata', done);
            setTimeout(done, 3000); // don't hang forever if the event never fires
          });
        }
        captureBtn.disabled = false;
      } catch (e) {
        console.error(e);
        showCameraMessage('Camera access is needed to continue. Please allow camera access in your browser and reload this page.');
        captureBtn.textContent = 'Reload page';
        captureBtn.disabled = false;
        captureBtn.onclick = () => location.reload();
      }
    }
    startCamera();

    captureBtn.addEventListener('click', () => {
      if (!stream) return;
      const targetW = 480;
      const ratio = video.videoHeight ? video.videoWidth / video.videoHeight : 4 / 3;
      canvas.width = targetW;
      canvas.height = Math.round(targetW / ratio);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      photoDataUrl = canvas.toDataURL('image/jpeg', 0.82);

      const img = document.createElement('img');
      img.src = photoDataUrl;
      img.id = 'capturedImg';
      video.style.display = 'none';
      camBox.appendChild(img);

      stream.getTracks().forEach(t => t.stop());
      stream = null;

      camActions.style.display = 'none';
      retakeActions.style.display = 'flex';
      updateContinueState();
    });

    retakeBtn.addEventListener('click', () => {
      photoDataUrl = null;
      const img = document.getElementById('capturedImg');
      if (img) img.remove();
      video.style.display = '';
      retakeActions.style.display = 'none';
      camActions.style.display = 'flex';
      updateContinueState();
      startCamera();
    });

    continueBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      if (!name || !photoDataUrl) return;
      continueBtn.disabled = true;
      setStatus('Submitting…');
      try {
        const r = await fetch('/admin/api/access-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ name, photo: photoDataUrl }),
        });
        const data = await r.json().catch(() => ({}));
        if (data.ok) {
          setStatus('Verified — continuing…', 'ok');
          const next = new URLSearchParams(location.search).get('next') || '/admin';
          location.href = next;
        } else {
          setStatus(data.error || 'Something went wrong. Please try again.', 'err');
          continueBtn.disabled = false;
        }
      } catch (e) {
        console.error(e);
        setStatus('Network error. Please try again.', 'err');
        continueBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
