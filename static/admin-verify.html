<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMC Spark — Access Verification</title>

  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="robots" content="noindex,nofollow">

  <link rel="stylesheet" href="/assets/app.css">
  <style>
    :root{--ink:#0f172a;--muted:#64748b;--bg:#0b1020;--panel:#0f172a;--line:#1f2f49;--brand:#4f7cab;--brand2:#2f4d70;--danger:#e5675f;--ok:#4caf82;--warn:#c99a45}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:#e5e7eb;margin:0}
    .wrap{max-width:460px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(2,6,23,.35);text-align:center}
    h1{margin:8px 0 6px;font-size:20px}
    .sub{color:var(--muted);margin:0 0 16px;font-size:13.5px;line-height:1.5}
    .cam-box{position:relative;width:100%;aspect-ratio:4/3;background:#0b1226;border:2px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;transition:border-color .2s ease}
    .cam-box.state-noface{border-color:var(--danger)}
    .cam-box.state-face{border-color:var(--brand)}
    .cam-box.state-captured{border-color:var(--ok)}
    .cam-box video, .cam-box img{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
    .cam-box img{transform:none}
    .cam-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;font-size:13px;color:#e5e7eb;text-align:center;background:rgba(11,16,32,.55)}
    .badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:999px;margin-bottom:14px}
    .badge.loading{background:rgba(148,163,184,.15);color:var(--muted)}
    .badge.noface{background:rgba(229,103,95,.15);color:var(--danger)}
    .badge.face{background:rgba(79,124,171,.18);color:#9db8dd}
    .badge.captured{background:rgba(76,175,130,.18);color:var(--ok)}
    .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
    .field{display:grid;gap:6px;margin:10px 0;text-align:left}
    .field input{width:100%;box-sizing:border-box;background:#0b1226;border:1px solid var(--line);border-radius:10px;padding:12px;color:#e5e7eb;font-size:14px}
    .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--brand);color:#fff;font-weight:800;border:none;border-radius:10px;padding:11px 14px;cursor:pointer;font-size:14px;width:100%}
    .btn:hover{background:var(--brand2)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn.ghost{background:transparent;border:1px solid var(--line);color:#e5e7eb;margin-top:8px}
    .status{min-height:20px;margin-top:10px;font-size:13px}
    .status.err{color:var(--danger)}
    .status.ok{color:var(--ok)}
    .logo{display:block;margin:0 auto 12px;max-width:140px}
    .top{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:4px}
    .top svg{width:26px;height:26px}
    .logout-link{display:block;margin-top:14px;color:var(--muted);font-size:12.5px;text-decoration:none}
    .logout-link:hover{color:#e5e7eb}
  </style>
</head>
<body data-page="admin-verify">
  <div class="wrap">
    <a href="https://amcspark.com" target="_blank">
      <img src="/assets/logo.png" alt="AMC Spark Logo" class="logo">
    </a>
    <div class="top">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#4f7cab"/><stop offset=".7" stop-color="#c99a45"/></linearGradient></defs>
        <path d="M13 2l-10 9h7l-3 11 10-12h-6l2-8z"/>
      </svg>
      <h1>Access Verification</h1>
    </div>
    <p class="sub">For our access records, please confirm you're really here: look at the camera and blink naturally - your photo is taken automatically the moment you do. Then confirm your name to continue.</p>

    <div class="badge loading" id="badge"><span class="dot"></span><span id="badgeText">Loading face detection…</span></div>

    <div class="cam-box" id="camBox">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" style="display:none"></canvas>
    </div>

    <div id="retakeActions" style="display:none">
      <button class="btn ghost" id="retakeBtn" type="button">Retake</button>
    </div>

    <div class="field">
      <label for="nameInput">Your name</label>
      <input id="nameInput" placeholder="e.g., Akshit" autocomplete="name" required>
    </div>

    <button class="btn" id="continueBtn" type="button" disabled>Continue</button>
    <div class="status" id="status"></div>

    <a href="/admin/logout" class="logout-link">Not you? Log out instead</a>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const camBox = document.getElementById('camBox');
    const badge = document.getElementById('badge');
    const badgeText = document.getElementById('badgeText');
    const retakeActions = document.getElementById('retakeActions');
    const retakeBtn = document.getElementById('retakeBtn');
    const nameInput = document.getElementById('nameInput');
    const continueBtn = document.getElementById('continueBtn');
    const statusEl = document.getElementById('status');

    let stream = null;
    let photoDataUrl = null;
    let irisDataUrls = null;
    let faceLandmarker = null;
    let rafId = null;
    let captured = false;

    // --- Landmark indices (standard MediaPipe FaceMesh/FaceLandmarker 478-point topology) ---
    const NOSE_TIP = 1, LEFT_CHEEK = 234, RIGHT_CHEEK = 454;
    const RIGHT_IRIS = [468, 469, 470, 471, 472]; // center + 4 boundary points
    const LEFT_IRIS = [473, 474, 475, 476, 477];

    const BLINK_CLOSED = 0.55;
    const BLINK_OPEN = 0.30;
    const MIN_STABLE_OPEN_MS = 400;   // must see steady, valid, open-eyed face this long before arming
    const MAX_BLINK_DURATION_MS = 600; // real blinks are fast - a slow hand-pass across the face isn't one
    const SMOOTH_FRAMES = 4;

    // Rolling buffers to smooth single-frame noise (e.g. a hand grazing the
    // face for one frame spiking a blink score) rather than reacting to it.
    const leftHist = [], rightHist = [];
    function smoothed(hist, val) {
      hist.push(val);
      if (hist.length > SMOOTH_FRAMES) hist.shift();
      return hist.reduce((a, b) => a + b, 0) / hist.length;
    }

    let stableOpenSince = null; // timestamp once we've been continuously valid+open
    let armed = false;          // stableOpenSince has held long enough to watch for a blink
    let closedAt = null;        // timestamp eyes were first seen closed after being armed

    function setStatus(msg, cls) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (cls ? ' ' + cls : '');
    }
    function setBadge(cls, text) {
      badge.className = 'badge ' + cls;
      badgeText.textContent = text;
    }
    function updateContinueState() {
      continueBtn.disabled = !(photoDataUrl && nameInput.value.trim());
    }
    nameInput.addEventListener('input', updateContinueState);

    function showCameraMessage(text) {
      const existing = camBox.querySelector('.cam-msg');
      if (existing) existing.remove();
      const msg = document.createElement('div');
      msg.className = 'cam-msg';
      msg.textContent = text;
      camBox.appendChild(msg);
    }
    function clearCameraMessage() {
      const existing = camBox.querySelector('.cam-msg');
      if (existing) existing.remove();
    }

    async function loadModel() {
      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU",
        },
        outputFaceBlendshapes: true,
        runningMode: "VIDEO",
        numFaces: 1,
      });
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = stream;
        try { await video.play(); } catch (e) { console.warn('video.play() failed:', e); }
        if (video.readyState < 2) {
          await new Promise((resolve) => {
            const done = () => { video.removeEventListener('loadeddata', done); resolve(); };
            video.addEventListener('loadeddata', done);
            setTimeout(done, 3000);
          });
        }
      } catch (e) {
        console.error(e);
        setBadge('noface', 'Camera unavailable');
        showCameraMessage('Camera access is needed to continue. Please allow camera access and reload this page.');
        setStatus('', '');
      }
    }

    // A face is only "good enough to trust" if it's a reasonable size (not
    // tiny/distant/mostly out of frame) and roughly symmetric front-on -
    // occlusion (a hand across the face) or an extreme angle throws this
    // symmetry off even when the model still outputs *some* landmarks.
    function faceQuality(landmarks) {
      const nose = landmarks[NOSE_TIP], lc = landmarks[LEFT_CHEEK], rc = landmarks[RIGHT_CHEEK];
      if (!nose || !lc || !rc) return { ok: false, reason: 'incomplete' };
      const faceWidth = Math.abs(rc.x - lc.x);
      if (faceWidth < 0.22) return { ok: false, reason: 'too small/far' };
      const distL = Math.abs(nose.x - lc.x), distR = Math.abs(rc.x - nose.x);
      const ratio = Math.min(distL, distR) / Math.max(distL, distR);
      if (ratio < 0.55) return { ok: false, reason: 'angled or occluded' };
      return { ok: true };
    }

    function eyeBlinkScores(result) {
      const cats = result.faceBlendshapes[0].categories;
      const left = cats.find(c => c.categoryName === 'eyeBlinkLeft')?.score || 0;
      const right = cats.find(c => c.categoryName === 'eyeBlinkRight')?.score || 0;
      return { left, right };
    }

    function cropRegion(points, padFactor) {
      const xs = points.map(p => p.x * video.videoWidth);
      const ys = points.map(p => p.y * video.videoHeight);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const w = maxX - minX, h = maxY - minY;
      const pad = Math.max(w, h) * padFactor;
      return { x: minX - pad, y: minY - pad, w: w + pad * 2, h: h + pad * 2 };
    }

    function cropToDataUrl(region, outSize) {
      const c = document.createElement('canvas');
      c.width = outSize; c.height = outSize;
      const ctx = c.getContext('2d');
      ctx.drawImage(video, region.x, region.y, region.w, region.h, 0, 0, outSize, outSize);
      return c.toDataURL('image/jpeg', 0.85);
    }

    function capturePhoto(landmarks) {
      const targetW = 480;
      const ratio = video.videoHeight ? video.videoWidth / video.videoHeight : 4 / 3;
      canvas.width = targetW;
      canvas.height = Math.round(targetW / ratio);
      const ctx = canvas.getContext('2d');
      // Mirror the capture to match the mirrored preview the person sees.
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      photoDataUrl = canvas.toDataURL('image/jpeg', 0.85);

      // Close-up crops of each eye/iris region, for extra visual detail
      // alongside the main photo - a webcam can't do true biometric iris
      // recognition (that needs an IR-illuminated sensor), so this is
      // supplementary imagery, not a biometric match.
      try {
        if (landmarks.length >= 478) {
          const rightIrisPts = RIGHT_IRIS.map(i => landmarks[i]);
          const leftIrisPts = LEFT_IRIS.map(i => landmarks[i]);
          const rightCrop = cropToDataUrl(cropRegion(rightIrisPts, 2.2), 160);
          const leftCrop = cropToDataUrl(cropRegion(leftIrisPts, 2.2), 160);
          irisDataUrls = [leftCrop, rightCrop];
        }
      } catch (e) { console.warn('iris crop failed:', e); irisDataUrls = null; }

      const img = document.createElement('img');
      img.src = photoDataUrl;
      img.id = 'capturedImg';
      video.style.display = 'none';
      clearCameraMessage();
      camBox.appendChild(img);
      camBox.className = 'cam-box state-captured';

      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      if (rafId) cancelAnimationFrame(rafId);

      captured = true;
      setBadge('captured', 'Captured — you’re verified');
      retakeActions.style.display = 'block';
      updateContinueState();
    }

    function detectLoop() {
      if (captured || !faceLandmarker || video.readyState < 2) {
        rafId = requestAnimationFrame(detectLoop);
        return;
      }
      const now = performance.now();
      const result = faceLandmarker.detectForVideo(video, now);
      const hasFace = result.faceLandmarks && result.faceLandmarks.length > 0;
      const quality = hasFace ? faceQuality(result.faceLandmarks[0]) : { ok: false };

      if (!hasFace) {
        camBox.className = 'cam-box state-noface';
        setBadge('noface', 'No face detected — center your face in frame');
        leftHist.length = 0; rightHist.length = 0;
        stableOpenSince = null; armed = false; closedAt = null;
      } else if (!quality.ok) {
        camBox.className = 'cam-box state-noface';
        setBadge('noface', 'Face not clearly visible — remove obstructions and face the camera directly');
        leftHist.length = 0; rightHist.length = 0;
        stableOpenSince = null; armed = false; closedAt = null;
      } else {
        const { left, right } = eyeBlinkScores(result);
        const sLeft = smoothed(leftHist, left), sRight = smoothed(rightHist, right);
        const bothOpen = sLeft < BLINK_OPEN && sRight < BLINK_OPEN;
        const bothClosed = sLeft > BLINK_CLOSED && sRight > BLINK_CLOSED;

        camBox.className = 'cam-box state-face';

        if (closedAt !== null) {
          // We're mid-blink (armed, eyes went closed) - watching for a fast reopen.
          if (bothOpen) {
            if (now - closedAt <= MAX_BLINK_DURATION_MS) {
              capturePhoto(result.faceLandmarks[0]);
              return;
            }
            // Too slow to be a real blink (e.g. a hand slowly passing by) - restart.
            closedAt = null; armed = false; stableOpenSince = now;
            setBadge('face', 'Face detected — blink naturally to capture');
          } else if (now - closedAt > MAX_BLINK_DURATION_MS + 400) {
            // Been "closed" too long even beyond the grace window - reset rather than hang.
            closedAt = null; armed = false; stableOpenSince = null;
            setBadge('face', 'Face detected — blink naturally to capture');
          } else {
            setBadge('face', 'Blink detected — hold still…');
          }
        } else if (bothOpen) {
          if (stableOpenSince === null) stableOpenSince = now;
          if (!armed && now - stableOpenSince >= MIN_STABLE_OPEN_MS) armed = true;
          setBadge('face', armed ? 'Face detected — blink naturally to capture' : 'Hold still…');
        } else if (bothClosed && armed) {
          closedAt = now;
          setBadge('face', 'Blink detected — hold still…');
        } else if (!bothOpen) {
          // Ambiguous/partial - don't count it as a stable open baseline.
          stableOpenSince = null;
        }
      }
      rafId = requestAnimationFrame(detectLoop);
    }

    retakeBtn.addEventListener('click', async () => {
      photoDataUrl = null;
      irisDataUrls = null;
      captured = false;
      leftHist.length = 0; rightHist.length = 0;
      stableOpenSince = null; armed = false; closedAt = null;
      const img = document.getElementById('capturedImg');
      if (img) img.remove();
      retakeActions.style.display = 'none';
      video.style.display = '';
      updateContinueState();
      await startCamera();
      detectLoop();
    });

    continueBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      if (!name || !photoDataUrl) return;
      continueBtn.disabled = true;
      setStatus('Submitting…');
      try {
        const r = await fetch('/admin/api/access-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ name, photo: photoDataUrl, iris: irisDataUrls }),
        });
        const data = await r.json().catch(() => ({}));
        if (data.ok) {
          setStatus('Verified — continuing…', 'ok');
          const next = new URLSearchParams(location.search).get('next') || '/admin';
          location.href = next;
        } else {
          setStatus(data.error || 'Something went wrong. Please try again.', 'err');
          continueBtn.disabled = false;
        }
      } catch (e) {
        console.error(e);
        setStatus('Network error. Please try again.', 'err');
        continueBtn.disabled = false;
      }
    });

    (async () => {
      const [_a, _b] = await Promise.all([loadModel(), startCamera()]);
      if (stream) {
        setBadge('noface', 'No face detected — center your face in frame');
        detectLoop();
      }
    })();
  </script>
</body>
</html>
